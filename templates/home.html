<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>

<h2>Welcome, {{ request.user.username }}</h2>
<h1>Product List</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>₹{{ product.price }}</td>
        <td>
            <a href="/update-product/{{ product.id }}/">Edit</a>
             <a href="/delete-product/{{ product.id }}/">
        Delete
    </a>
        </td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/add-product/">Add New Product</a>
<br>
<a href="/logout/">Logout</a>
</body>
</html>
